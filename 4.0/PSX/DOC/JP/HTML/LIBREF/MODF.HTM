<H1>
    modf
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        整数部と小数部への分割
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>double<B> modf</B> (
double <I>x</I>,
double *<I>y</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>x</I>		浮動小数点値
<I>y</I>		整数部を格納するためのバッファへのポインタ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>x </I>を整数部と小数部への分割する。 <BR>
    整数部は <I>y </I>に格納し、小数部が返り値となす。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>x </I>の小数部 <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    整数部、小数部ともに符号は<I>x </I>と同じ。 <BR>
</blockquote>
