</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>Lzc </B>(

)
</PRE>
</blockquote>

<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>

</PRE>
</blockquote>

<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>

<BR>
</blockquote>
