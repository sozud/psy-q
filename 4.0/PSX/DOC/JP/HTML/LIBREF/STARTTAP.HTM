<H1>
    StartTAP
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        コントローラの読みとりを開始
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>StartTAP </B>( void )
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>なし
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    垂直帰線区間割り込みをトリガとして行なわれるコントローラの読みとりを開始する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    成功すると1を、失敗すると0を返す <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    割り込みを許可した状態で返る。 <BR>
<BR>
</blockquote>
