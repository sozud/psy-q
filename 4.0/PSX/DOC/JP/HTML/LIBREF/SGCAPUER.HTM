<HR SIZE="5">

<!-- 関数説明 -->
<DIV ALIGN="right">

</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>SpuGetCommonAttr</B> (

)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>

</PRE>
</blockquote>

<BR>
</blockquote>
