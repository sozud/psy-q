    DrawPrim
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        プリミティブを描画
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>DrawPrim </B>(
void *<I>p </I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>p		</I>プリミティブのポインタ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    初期化済みのプリミティブを一つ実行する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    DrawPrim() は、ノンブロック関数のため、実際の転送の終了はDrawSync()で検出する必要がある。DrawOTag()より低速。 <BR>
</blockquote>
