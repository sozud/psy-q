<H1>
    SpuGetMute
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        サウンドのミュートの状態を診断
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>SpuGetMute</B> ( void )
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>なし
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    サウンドの現在のミュートのオン/オフの状態を診断する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    現在設定されている値 <BR>
      <BR>
<CENTER>
<TABLE BORDER>
    <TD ALIGN="center">返り値</TD><TD ALIGN="center">意味</TD><TR>
    <TD>SPU_ON</TD><TD>ミュートオン</TD><TR>
    <TD>SPU_OFF</TD><TD>ミュートオフ</TD><TR>
</TABLE>
<BR>
</CENTER>
<BR>
</blockquote>
