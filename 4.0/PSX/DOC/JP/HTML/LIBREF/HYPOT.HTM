<H1>
    hypot
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        複素数絶対値
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>double <B>hypot</B> (
double <I>x</I>, 
double <I>y</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>x</I>		浮動小数点値
<I>y</I>		浮動小数点値
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    複素数 <I>x</I>+i<I>y </I>の絶対値を求める。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>x<SUP></I>2 </SUP>と <I>y<SUP></I>2 </SUP>の和の平方根。 <BR>
</blockquote>
