<H1>
    SetRGBcd
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        原色ベクトルとＧＰＵコードを設定する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>SetRGBcd </B>(
CVECTOR *<I>v</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>v</I>		入力：色ベクトル、ＧＰＵコード
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    原色ベクトルとＧＰＵコード <I>v </I>を設定する。 <BR>
<BR>
    引数フォーマット： <BR>
    <I>v</I>-&gt;r,g,b,cd : (0,8,0) <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
</blockquote>
