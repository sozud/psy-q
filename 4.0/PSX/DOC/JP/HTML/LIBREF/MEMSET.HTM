<H1>
    memset
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        メモリブロックに指定された文字を書き込む
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;memory.h&gt;
void * <B>memset </B>(
const void * <I>s</I>,
long <I>c</I>,
size_t <I>n</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>s		</I>メモリブロック
<I>c		</I>文字
<I>n		</I>文字数
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>s </I>から始まる <I>n </I>バイトのメモリブロックに <I>c </I>を書き込む。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>s </I>を返す。 <BR>
</blockquote>
