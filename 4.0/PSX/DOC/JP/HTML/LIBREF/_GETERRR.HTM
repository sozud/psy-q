<H1>
    _get_error
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        ファイルディスクリプタのエラーコードの取得
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>_get_error </B>( 
long <I>fd</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>fd</I>		ファイルディスクリプタ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    指定したファイルディスクリプタについて直近に起こったエラーのコードを返す。 <BR>
    エラーコードは sys/errno.h に定義されている。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    エラーコード <BR>
</blockquote>
