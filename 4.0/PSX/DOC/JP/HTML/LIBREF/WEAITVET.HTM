<H1>
    WaitEvent
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        イベントの発生を待つ
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>WaitEvent </B>( 
long <I>event</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>event		</I>イベントディスクリプタ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    ディスクリプタ <I>event </I>が指定するイベントが発生するまで待ち、未発生状態に再初期化してから戻る。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    正常終了すると1を、以外は0を返す。 <BR>
<BR>
</blockquote>
