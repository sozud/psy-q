<H1>
    PadRead
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        コントローラからデータを読む
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>u_long <B>PadRead </B>(
int<I> id</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>id		</I>コントローラID
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>id </I>で示されるコントローラからデータを読み込む。 <BR>
    <I>id</I> はコントローラ番号。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    獲得されたコントローラの値 <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    現在 <I>id</I> は意味を持たない。 <BR>
</blockquote>
