<H1>
    cd
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        デフォルトディレクトリ変更
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>long <B>cd </B>( 
char *<I>path</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>path</I>		デフォルトディレクトリパス
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    ファイルシステムについてデフォルトのディレクトリパスを変更する。 <BR>
    ファイルシステムは <I>path </I>先頭部分のデバイス名で指定する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    成功すると1を、それ以外は0を返す。 <BR>
</blockquote>
