<H1>
    putc
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        ストリームに１文字出力する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;stdio.h&gt;
void <B>putc </B>(
char <I>c</I>,
FILE *<I>stream</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>c		</I>出力文字
<I>stream		</I>出力ストリーム
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    出力ストリーム <I>stream </I>に文字 <I>c </I>を出力する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>
