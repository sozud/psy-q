<H1>
    bcopy
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        メモリブロックを複写する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;memory.h&gt;
void <B>bcopy </B>(
char * <I>src</I>,
char * <I>dest</I>,
long <I>n</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>src</I>		複写元
<I>dest</I>		複写先
<I>n</I>		複写バイト数
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>dest </I>に、<I>src </I>の最初の <I>n </I>バイトを複写する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>
