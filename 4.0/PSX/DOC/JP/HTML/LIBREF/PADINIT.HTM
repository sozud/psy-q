<H1>
    PadInit
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        コントローラの初期化
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>PadInit</B>(
int <I>mode</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>mode		</I>コントローラタイプ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    現在接続されている全てのコントローラを初期化する。 <BR>
    <I>mode </I>は コントローラのタイプを指定。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    サポートされているタイプは 2 （標準コントローラ）のみ。 <BR>
    <I>mode</I> は現在意味をもたない。 <BR>
</blockquote>
