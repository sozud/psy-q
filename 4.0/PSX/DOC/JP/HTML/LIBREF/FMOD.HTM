<PRE>double <B>fmod</B> (

)
</PRE>
</blockquote>

<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>x</I>		浮動小数点値

</PRE>
</blockquote>

<B>解説</B>

<BR>
</blockquote>

</blockquote>
