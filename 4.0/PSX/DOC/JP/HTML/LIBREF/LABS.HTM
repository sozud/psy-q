<H1>
    labs
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        絶対値を計算する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;stdlib.h&gt;
long <B>labs </B>(
long <I>i</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>i</I>		整数値
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    整数 <I>i </I>の絶対値を計算する。本システム上では、abs() と等価な関数となる。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    引数の絶対値を返す。 <BR>
<BR>
</blockquote>
