<H1>
    rand
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        乱数を発生する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;stdlib.h&gt;
long <B>rand </B>( void )
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>なし
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    0からRAND_MAX(0x7FFF=32767)の間の疑似乱数を発生する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    生成された疑似乱数を返す。 <BR>
<BR>
</blockquote>
