    SetDispMask
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        ディスプレイマスクを設定
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>SetDispMask</B> (
int <I>mask</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>mask		</I>0: ディスプレイに表示を行なわない。
 		1: ディスプレイに表示を行なう。
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    ディスプレイへの表示を許可する。 <BR>
<BR>
</blockquote>
