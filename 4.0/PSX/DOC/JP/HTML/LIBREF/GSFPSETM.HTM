</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>GsSetFogParam </B>(

)
</PRE>
</blockquote>

<PRE><I>fogparam	</I>フォグパラメータ構造体へのポインタ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>

<blockquote>
