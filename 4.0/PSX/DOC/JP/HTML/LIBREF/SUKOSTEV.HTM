<H1>
    SsUtKeyOffV
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        ボイス番号を指定してキーオフする
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>short <B>SsUtKeyOffV </B>(
short<I> voice</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>voice		</I>ボイス番号0～23
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    ボイス番号(0～23)を指定してボイスをキーオフする。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    成功したら0を、失敗したら-1を返す。 <BR>
<BR>
</blockquote>
