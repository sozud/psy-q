<H1>
    longjmp
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        非局所的ジャンプ
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>#include &lt;setjmp.h&gt;
void <B>longjmp</B> (
jmp_buf <I>p</I>,
int <I>val</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>p</I>		環境退避変数
<I>val</I>		setjmp()の返却値
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>p </I>で指定された着地点へ非局所的にジャンプする。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし。正常に実行されると返らない。 <BR>
<BR>
</blockquote>
