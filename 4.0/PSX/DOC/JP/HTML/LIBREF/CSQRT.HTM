<H1>
    csqrt
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        平方根
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>int <B>csqrt</B>(
int <I>a</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>a		</I>任意の値
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    固定小数点（4096=1.0）の平方根を固定小数点（4096=1.0）で求める。 <BR>
    SquareRoot12と同じ機能で必要なテーブルが小さい。 <BR>
<BR>
    フォーマット： <BR>
    <I>a</I> : (1,19,12) <BR>
    返り値 : (1,19,12) <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    sqrt(<I>a</I>) <BR>
</blockquote>
