<!-- 関数説明 -->
<DIV ALIGN="right">
        絶対セクタ番号から分・秒・セクタを得る
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>CdlLOC *<B>CdIntToPos </B>(
int <I>i</I>,

)
</PRE>
</blockquote>

<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>

<PRE><I>i		</I>絶対セクタ番号

</PRE>
</blockquote>

</blockquote>
