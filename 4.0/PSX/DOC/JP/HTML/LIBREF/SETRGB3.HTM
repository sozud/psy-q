<H1>
    setRGB3
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        プリミティブのRGBメンバを設定
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><B>setRGB3 </B>( <I>p</I>,<I>r3</I>,<I>g3</I>,<I>b3 </I>)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>p		</I>プリミティブのポインタ
<I>r3</I>,<I>g3</I>,<I>b3	</I>プリミティブのRGBメンバ
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    プリミティブのRGBメンバに値を設定する。 <BR>
<BR>
</blockquote>

<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>

<BR>
</blockquote>
