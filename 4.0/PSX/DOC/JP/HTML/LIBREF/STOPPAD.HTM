<H1>
    StopPAD
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        コントローラの読みとりを停止
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>StopPAD </B>( void )
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>なし
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    コントローラの読みとりを停止する。割り込みは禁止しない。 <BR>
    内部でChangeClearPAD(1)を実行する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>
