<H1>
    SetSprt
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        スプライトプリミティブを初期化
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>SetSprt</B> (
SPRT *<I>p </I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>p		</I>プリミティブ先頭アドレス
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>p </I>で指定されたそれぞれのプリミティブを初期化する。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    スプライトプリミティブは同等の処理をポリゴンプリミティブで行なう場合よりも高速。 <BR>
</blockquote>
