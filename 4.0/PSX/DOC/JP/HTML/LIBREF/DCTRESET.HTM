<H1>
    DecDCTReset
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        画像処理サブシステムの初期化
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>DecDCTReset</B> (
int <I>mode</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>mode</I>		リセットモード
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    画像処理サブシステムをリセットする。 <BR>
    <I>mode</I> に指定できる値は次の通り。 <BR>
      <BR>
<CENTER>
<TABLE BORDER>
    <TD ALIGN="center">mode</TD><TD ALIGN="center">内容</TD><TR>
    <TD ALIGN="center">0</TD><TD>全てを初期化</TD><TR>
    <TD ALIGN="center">1</TD><TD>現在実行中の処理のみを中断</TD><TR>
</TABLE>
<BR>
</CENTER>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
</blockquote>
