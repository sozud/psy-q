<H1>
    DecDCTBufSize
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        ランレベルのサイズを獲得する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>int <B>DecDCTBufSize </B>(
u_long *<I>bs</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>bs</I>		ビットストリーム
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    入力ビットストリーム <I>bs </I>を解凍し中間形式として生成されるランレベルのサイズを解凍せずに取得する。実際の解凍は行なわない。 <BR>
<BR>
</blockquote>
