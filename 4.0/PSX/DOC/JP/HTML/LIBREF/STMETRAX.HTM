<H1>
    SetTransMatrix
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        平行移動ベクトルを設定する
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>void <B>SetTransMatrix </B>(
MATRIX *<I>m</I>
)
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>m</I>		入力：マトリックス
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    <I>m </I>で与えられる平行移動ベクトルを設定する。 <BR>
<BR>
    引数フォーマット： <BR>
    <I>m</I>-&gt;t[i] : (1,31,0) <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    なし <BR>
</blockquote>
