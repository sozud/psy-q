<H1>
    GetClut
<HR SIZE="5">
</H1>
<!-- 関数説明 -->
<DIV ALIGN="right">
        プリミティブのclutメンバの値を計算
</DIV><P>

<!-- 形式 -->
<B>形式</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE>u_short <B>GetClut </B>(
int <I>x</I>,
int <I>y</I>
) 
</PRE>
</blockquote>

<!-- 引数 -->
<B>引数</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
<PRE><I>x, y</I>		CLUT のフレームバッファアドレス
</PRE>
</blockquote>

<!-- 解説 -->
<B>解説</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    テクスチャ CLUT ID を計算しそれを返す。 <BR>
<BR>
</blockquote>

<!-- 返り値 -->
<B>返り値</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    clut ID <BR>
<BR>
</blockquote>

<!-- 備考 -->
<B>備考</B>
<HR NOSHADE ALIGN="left" SIZE=2 WIDTH=20%>
<blockquote>
    CLUT アドレスは、x 方向は 16 の倍数に限られる。 <BR>
</blockquote>
